<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capstone</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body{
           background-color: aqua;
          
        }

        nav{
            background-color: black;
            border-radius: 20px;
           padding: 10px ;
        }

        a{
            color:darkgoldenrod;
            font-size: 25px;
            text-decoration: none;
           margin: 10px;
        }

        a:hover{
            color: brown;
        }
        
        #rex{
            background-color: chartreuse;
        }
        
    </style>
</head>

<body>
    <nav>
      <a href="#" id="rex">Home</a>
      <a href="#">Gallary</a>
      <a href="#">About us</a>
      <a href="#">Contact Us</a>
    </nav>

    <section>
        <img class="mySlides" src="Lion.jpg" style="height: 500px; width: 100%;">
        <img class="mySlides" src="Lepord.jpg" style="height: 500px; width: 100%;">
        <img class="mySlides" src="Deer.jpg" style="height: 500px; width: 100%;">
    </section>
    <script>
        var myIndex = 0;
        carousel();

        function carousel(){
          var i;
          var x =document.getElementsByClassName("mySlides")
          for (i =0; i< x.length ; i++) {
            x[i].style.display = "none";
          }
          myIndex++
          if(myIndex > x.length) {myIndex= 1 }
          x[myIndex-1].style.display = "block";
          setTimeout(carousel, 3000);
          
        }
    </script>
</body>
</html>
